services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weatherdb}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-weather} -d ${POSTGRES_DB:-weatherdb}"
        ]
      interval: 10s
      timeout: 5s
      retries: 20

    restart: unless-stopped


  # ============================================================
  # RabbitMQ
  # ============================================================
  rabbitmq:
    image: rabbitmq:4-management

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-weather}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-weather}

    ports:
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 30

    restart: unless-stopped


  # ============================================================
  # Ollama
  # ============================================================
  ollama:
    image: ollama/ollama:latest

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 10s
      timeout: 5s
      retries: 30

    restart: unless-stopped


  # ============================================================
  # Ollama Model Initialization
  #
  # Waits for Ollama, pulls the configured model, verifies it,
  # then exits successfully.
  #
  # Consumer and API will not start until this service exits 0.
  # ============================================================
  ollama-init:
    image: ollama/ollama:latest

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}

    entrypoint: /bin/sh

    command:
      - -c
      - |
        set -e

        echo "Waiting for Ollama API..."

        until ollama list >/dev/null 2>&1; do
          echo "Ollama is not ready yet..."
          sleep 2
        done

        echo "Ollama is ready."

        echo "Pulling model: $${OLLAMA_MODEL}"
        ollama pull "$${OLLAMA_MODEL}"

        echo "Verifying model: $${OLLAMA_MODEL}"
        ollama show "$${OLLAMA_MODEL}" >/dev/null

        echo "Model is ready: $${OLLAMA_MODEL}"

    restart: "no"


  # ============================================================
  # Weather Producer
  #
  # Fetches weather from Open-Meteo and publishes forecast
  # events to RabbitMQ.
  #
  # Metrics: producer:9101
  # ============================================================
  producer:
    build: .

    command:
      [
        "python",
        "-m",
        "app.workers.producer"
      ]

    env_file:
      - .env

    depends_on:
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # Weather Consumer
  #
  # Consumes weather events from RabbitMQ.
  # Calls Qwen through Ollama to generate recommendations.
  # Persists enriched forecasts to PostgreSQL.
  #
  # Metrics: consumer:9102
  # ============================================================
  consumer:
    build: .

    command:
      [
        "python",
        "-m",
        "app.workers.consumer"
      ]

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      ollama-init:
        condition: service_completed_successfully

    restart: unless-stopped


  # ============================================================
  # FastAPI
  #
  # HTTP API used by Streamlit and other clients.
  # Agent queries local PostgreSQL context and Qwen/Ollama.
  # ============================================================
  api:
    build: .

    command:
      [
        "uvicorn",
        "app.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      ollama-init:
        condition: service_completed_successfully

    restart: unless-stopped


  # ============================================================
  # Streamlit UI
  # ============================================================
  streamlit:
    build: .

    command:
      [
        "streamlit",
        "run",
        "app/ui/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]

    env_file:
      - .env

    ports:
      - "8501:8501"

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


  # ============================================================
  # Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:latest

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    restart: unless-stopped


  # ============================================================
  # Grafana
  #
  # Datasource and dashboard are provisioned directly from
  # files committed to the repository.
  # ============================================================
  grafana:
    image: grafana/grafana:latest

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped


# ==============================================================
# Persistent Docker Volumes
# ==============================================================
volumes:

  postgres_data:

  rabbitmq_data:

  ollama_data:

  grafana_data: