services:

  # ============================================================
  # PostgreSQL
  # ============================================================
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-weatherdb}
      POSTGRES_USER: ${POSTGRES_USER:-weather}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-weather}

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-weather} -d ${POSTGRES_DB:-weatherdb}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  # ============================================================
  # RabbitMQ
  # ============================================================
  rabbitmq:
    image: rabbitmq:4-management

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-weather}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-weather}

    ports:
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 20

    restart: unless-stopped


  # ============================================================
  # Ollama
  # ============================================================
  ollama:
    image: ollama/ollama:latest

    volumes:
      - ollama_data:/root/.ollama

    healthcheck:
      test:
        [
          "CMD",
          "ollama",
          "list"
        ]
      interval: 10s
      timeout: 5s
      retries: 20

    restart: unless-stopped


  # ============================================================
  # Ollama model initialization
  #
  # Pulls the configured model before API/consumer are allowed
  # to start.
  # ============================================================
  ollama-init:
    image: ollama/ollama:latest

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct}

    entrypoint:
      - /bin/sh
      - -c

    command: >
      ollama pull "$${OLLAMA_MODEL}"

    restart: "no"


  # ============================================================
  # Weather Producer
  #
  # Fetches weather from Open-Meteo and publishes events
  # to RabbitMQ.
  # ============================================================
  producer:
    build: .

    command:
      [
        "python",
        "-m",
        "app.workers.producer"
      ]

    env_file:
      - .env

    depends_on:
      rabbitmq:
        condition: service_healthy

    restart: unless-stopped


  # ============================================================
  # Weather Consumer
  #
  # Reads RabbitMQ messages, calls the local LLM, persists
  # enriched forecasts to PostgreSQL, then ACKs the message.
  #
  # Important:
  # ollama-init must complete successfully before this starts.
  # ============================================================
  consumer:
    build: .

    command:
      [
        "python",
        "-m",
        "app.workers.consumer"
      ]

    env_file:
      - .env

    depends_on:
      postgres:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      ollama-init:
        condition: service_completed_successfully

    restart: unless-stopped


  # ============================================================
  # FastAPI
  # ============================================================
  api:
    build: .

    command:
      [
        "uvicorn",
        "app.api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    env_file:
      - .env

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

      ollama-init:
        condition: service_completed_successfully

    restart: unless-stopped


  # ============================================================
  # Streamlit UI
  # ============================================================
  streamlit:
    build: .

    command:
      [
        "streamlit",
        "run",
        "app/ui/streamlit_app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]

    env_file:
      - .env

    ports:
      - "8501:8501"

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


  # ============================================================
  # Prometheus
  # ============================================================
  prometheus:
    image: prom/prometheus:latest

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    restart: unless-stopped


  # ============================================================
  # Grafana
  # ============================================================
  grafana:
    image: grafana/grafana:latest

    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    ports:
      - "3000:3000"

    depends_on:
      - prometheus

    restart: unless-stopped


# ==============================================================
# Persistent Docker volumes
# ==============================================================
volumes:

  postgres_data:

  rabbitmq_data:

  ollama_data:

  grafana_data:
